[package]
license = "MIT"
name = "mon-desktop"
version = "1.0.1"
description = "Local meeting recording and minutes"
edition = "2021"

[lib]
name = "mon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mon-contracts = { path = "../../crates/mon-contracts" }
mon-core = { path = "../../crates/mon-core" }
mon-native = { path = "../../crates/mon-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tempfile = "3"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3"] }
flacenc = { version = "=0.5.1", default-features = false }
md-5 = "0.10"
crc = "=3.4.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["libc", "NSApplication", "NSRunningApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL", "NSObject"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_StationsAndDesktops"] }
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
