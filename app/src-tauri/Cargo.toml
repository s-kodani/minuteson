[package]
name = "mon-desktop"
version = "0.1.0"
description = "Local meeting recording and minutes"
edition = "2021"

[lib]
name = "mon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tempfile = "3"
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "mp3"] }
flacenc = { version = "=0.5.1", default-features = false }
md-5 = "0.10"
crc = "=3.4.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL", "NSObject"] }
