[package]
name = "mon-desktop"
version = "0.1.0"
description = "Local meeting recording and minutes"
edition = "2021"

[lib]
name = "mon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
