[package]
name = "mon-desktop"
version = "0.1.0"
description = "Local meeting recording and minutes"
edition = "2021"

[lib]
name = "mon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tempfile = "3"
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "mp3"] }
flacenc = { version = "=0.5.1", default-features = false }
md-5 = "0.10"
crc = "=3.4.0"
libc = "0.2"

# Keep test-only symbol tables from inflating the native test launcher.
# Normal dev/release builds and runtime checks are unchanged.
[profile.test]
strip = "symbols"
debug = 0
# Reuse one test cache through tools/mon_rust_tests.py. Its 10 GiB post-run
# budget trims incremental state first, without retaining per-task caches.
# Explicit partitioning still limits individual code-generation units.
incremental = true
codegen-units = 256
# false still enables local ThinLTO. Disable its very large intermediate
# bitcode in tests so the latest incremental generation fits the cache budget.
lto = "off"
debug-assertions = true
overflow-checks = true

# Reduce the root package's oversized arm64 test text. All overrides here
# remain test-only; production profiles and runtime checks stay intact.
[profile.test.package.mon-desktop]
opt-level = 1

# Speed up repeated real SQLite work in tests. Bundled C compilation receives
# this package's OPT_LEVEL too. WAL/FULL, migrations and Rust checks stay intact.
[profile.test.package.libsqlite3-sys]
opt-level = 2

[profile.test.package.rusqlite]
opt-level = 1

# The default sha2 0.10 backend on this Apple Silicon build is software.
# Keep every physical-byte hash check, but compile its compression rounds fast.
[profile.test.package.sha2]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["libc", "NSApplication", "NSRunningApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL", "NSObject"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_RestartManager", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_StationsAndDesktops"] }
tauri-plugin-dialog = "2"
