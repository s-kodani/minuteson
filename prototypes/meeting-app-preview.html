const infos={mini:'実装時は、他アプリより前面に表示する独立した小さなウィンドウです。このHTMLではページ内に表示しています。左端をドラッグして移動できます。',local:'録音、文字起こし、話者分離、議事録生成は端末内で行う設計です。このプレビューはサンプルデータだけを使います。',capture:'PC音声はOSから取得します。会議サービスとの連携に依存せず、Meet・Zoom・Teamsなどの音声を録音します。PC全体では通知や他タブの音も入るため、対象アプリを選ぶこともできます。',mic:'自分の声を録音する入力機器です。PC音声と合わせて記録します。実装時はヘッドセットとスピーカーの両方に対応します。',profile:'標準は処理速度と品質のバランスを重視します。高精度は処理時間とメモリ使用量が増える想定です。',timing:'文字起こしと話者分離は、録音を終了してから自動で開始します。録音中のリアルタイム文字起こしは行いません。',speakers:'声の特徴で発言を話者ごとに分類します。名前は自動で特定しません。話者名と発言の割り当ては後から修正できます。重複発話は確認用に表示します。',citation:'根拠を押すと、対応する発言と時刻を確認できます。実装では生成時に参照した解析版に根拠を固定します。',retention:'録音はFLAC、会議情報はSQLiteで保存する設計です。保存先は変更でき、解析結果と議事録の版も管理します。',demo:'画面と操作の確認用です。録音、音声再生、解析の進行はシミュレーションです。編集内容はこのページを開いている間だけ保持します。'};
function info(key){return `<button class="info" onclick="showInfo(event,'${key}')" aria-label="説明を表示">i</button>`}function showInfo(e,key){e.stopPropagation();let p=$('#popover');p.textContent=infos[key];p.hidden=false;let r=e.currentTarget.getBoundingClientRect();p.style.left=Math.min(Math.max(12,r.left),innerWidth-297)+'px';p.style.top=Math.min(r.bottom+10,innerHeight-p.offsetHeight-12)+'px'}document.addEventListener('click',e=>{if(!e.target.closest('#popover'))$('#popover').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#popover').hidden=true});
function toast(message){let t=document.createElement('div');t.className='toast';t.innerHTML='<span>✓</span><span>'+esc(message)+'</span><button class="ghost" style="min-height:24px;padding:0 4px" aria-label="通知を閉じる">×</button>';t.querySelector('button').onclick=()=>t.remove();$('#toasts').append(t);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();setTimeout(()=>t.remove(),4000)}
function modal(heading,body,label,action,danger=false){$('#modal-body').innerHTML=`<h2 id="modal-title">${heading}</h2>${body}`;$('#confirm').textContent=label;$('#confirm').className=danger?'danger':'primary';$('#cancel').onclick=()=>$('#dialog').close();$('#confirm').onclick=()=>{const value=$('#modal-input')?.value;$('#dialog').close();action(value)};$('#dialog').showModal();$('#cancel').focus()}
function navigate(next){$('#popover').hidden=true;screen=next;$('#preview').value=next;$('.mobile-label').value=next;document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===next));$('#crumb').textContent=({list:'会議一覧',setup:'新しい録音',record:'会議 / 録音中',processing:'会議 / 解析状況',transcript:'会議 / 文字起こし',minutes:'会議 / 議事録',settings:'設定'})[next];render()}
function previewScreen(next){if(next==='record'){if(!recording){recording=true;elapsed=754;updateRecording()}navigate('record')}else if(next==='processing'){startProcessing()}else navigate(next)}
function render(){const main=$('#main');if(screen==='list')main.innerHTML=listView();if(screen==='setup')main.innerHTML=setupView();if(screen==='record')main.innerHTML=recordView();if(screen==='processing')main.innerHTML=processingView();if(screen==='transcript')main.innerHTML=transcriptView();if(screen==='minutes')main.innerHTML=minutesView();if(screen==='settings')main.innerHTML=settingsView();if(screen==='list')renderRows();updateRecording();}
function listView(){return `<div class="content"><div class="row spread page-heading"><div><div class="eyebrow" style="margin-bottom:7px">YOUR WORKSPACE</div><h1>会議一覧</h1><p class="subtitle">会話を記録して、次のアクションにつなげる。</p></div><button class="primary" onclick="navigate('setup')">＋ 新しい録音</button></div><div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="会議名を検索" aria-label="会議名を検索" oninput="renderRows()"></div><div class="filters">${['すべて','議事録作成済み','要確認','文字起こし済み'].map(f=>`<button class="${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div></div><table class="table"><thead><tr><th style="width:49%">会議名</th><th>録音日時</th><th>長さ</th><th>状態</th><th></th></tr></thead><tbody id="meeting-rows"></tbody></table><div class="row spread" style="margin-top:18px"><span class="muted small" id="count"></span><span class="muted small">サンプルの会議データ ${info('demo')}</span></div></div>`}
function renderRows(){let q=$('#search')?.value||'';let rows=meetings.filter(m=>m.title.includes(q)&&(filter==='すべて'||m.status===filter));$('#meeting-rows').innerHTML=rows.length?rows.map(m=>`<tr><td><button class="meeting-name" onclick="openMeeting(${m.id})">${esc(m.title)}</button><div class="meeting-meta">${m.people} · マイク＋PC音声</div></td><td class="muted">${m.date}</td><td class="muted">${m.duration}</td><td><span class="badge ${m.status==='要確認'?'warn':'good'}">${m.status}</span></td><td><button class="icon ghost" onclick="meetingActions(${m.id})" aria-label="${esc(m.title)}の操作">⋯</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">条件に合う会議はありません。</td></tr>';$('#count').textContent=rows.length+'件の会議'}function setFilter(f){filter=f;render()}function openMeeting(id){title=meetings.find(m=>m.id===id).title;navigate(id===1?'minutes':'transcript')}
function meetingActions(id){let m=meetings.find(m=>m.id===id);modal('会議の操作',`<p>${esc(m.title)}</p><button style="width:100%;margin-top:20px" onclick="renameMeeting(${id})">会議名を変更</button><button style="width:100%;margin-top:10px;color:var(--danger)" onclick="deleteMeeting(${id})">会議を削除</button>`,'開く',()=>openMeeting(id))}function renameMeeting(id){$('#dialog').close();const m=meetings.find(m=>m.id===id);modal('会議名を変更',`<input id="modal-input" aria-label="会議名" value="${esc(m.title)}">`,'保存',v=>{if(v?.trim()){m.title=v.trim();render();toast('会議名を保存しました')}})}function deleteMeeting(id){$('#dialog').close();modal('会議を削除しますか？','<p>録音・文字起こし・議事録を削除します。この操作は取り消せません。</p>','削除する',()=>{meetings=meetings.filter(m=>m.id!==id);render();toast('会議を削除しました（デモ）')},true)}
function meter(n=8){return `<div class="meter">${Array.from({length:16},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`}
function setupView(){return `<div class="content"><div class="setup"><div class="page-heading"><div class="eyebrow" style="margin-bottom:7px">NEW RECORDING</div><h1>録音を準備する</h1><p class="subtitle">音声の入力を確認したら、すぐに始められます。</p></div><div class="card"><h2>会議の設定</h2><div class="field"><label for="meeting-title">会議名</label><input id="meeting-title" value="プロダクト開発定例"></div><div class="field"><label for="microphone">マイク ${info('mic')}</label><select id="microphone"><option>システムの既定のマイク</option><option>USBヘッドセット</option><option>内蔵マイク</option></select><div class="input-status"><span>● 入力を検出</span>${meter(9)}</div></div><div class="field"><label>PC音声 ${info('capture')}</label><div class="choice"><button class="${audioMode==='system'?'chosen':''}" onclick="changeCapture('system')"><b>PC全体の音声</b><small>標準の録音範囲</small></button><button class="${audioMode==='app'?'chosen':''}" onclick="changeCapture('app')"><b>対象アプリを選択</b><small>録音する音声を絞る</small></button></div>${audioMode==='app'?'<select style="margin-top:12px" aria-label="録音するアプリ"><option>Google Chrome — Google Meet</option><option>Zoom Workplace</option><option>Microsoft Teams</option></select>':''}<div class="input-status"><span>● PC音声を取得可能</span>${meter(6)}</div></div><div class="field"><label>解析プロファイル ${info('profile')}</label><div class="choice"><button class="${profile==='standard'?'chosen':''}" onclick="changeProfile('standard')"><b>標準</b><small>速度と品質のバランス</small></button><button class="${profile==='quality'?'chosen':''}" onclick="changeProfile('quality')"><b>高精度</b><small>品質を優先</small></button></div></div></div><div class="setup-actions"><button onclick="testInput(this)">▷ 5秒間の入力テスト</button><button class="primary" style="min-height:44px" onclick="startRecording()" ${recording?'disabled':''}><span class="dot" style="background:currentColor"></span>${recording?'別の会議を録音中':'録音を開始'}</button></div><div class="row spread small muted" style="margin-top:20px"><span style="color:var(--green)">✓ ローカルAIの準備完了 ${info('local')}</span><span>入力状態はサンプル</span></div></div></div>`}
function changeCapture(mode){const v=$('#meeting-title').value;audioMode=mode;render();$('#meeting-title').value=v}function changeProfile(mode){const v=$('#meeting-title').value;profile=mode;render();$('#meeting-title').value=v}function testInput(btn){btn.disabled=true;btn.textContent='入力テスト中…';setTimeout(()=>{if(btn.isConnected){btn.disabled=false;btn.textContent='▷ 5秒間の入力テスト'}toast('入力テスト完了：マイク・PC音声ともに正常（デモ）')},5000)}
function startRecording(){title=$('#meeting-title').value.trim()||'新しい会議';recording=true;elapsed=0;navigate('record');toast('録音を開始しました（デモ）')}function updateRecording(){document.body.classList.toggle('recording',recording);$('#mini').hidden=!recording;$('#mini-clock').textContent=formatTime(elapsed);const c=$('#record-time');if(c)c.textContent=formatTime(elapsed)}function formatTime(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function recordView(){return `<div class="content"><div class="row spread"><div><h1>${esc(title)}</h1><p class="subtitle">マイク＋PC音声 · 標準プロファイル</p></div></div><div class="record-center"><span class="badge" style="color:var(--danger)"><span class="dot"></span>${recording?'録音中':'録音プレビュー'}</span><div class="time" id="record-time">${formatTime(elapsed)}</div><div class="card rec-inputs"><div class="row"><span>♩</span><div><h3>マイク</h3><span class="small muted">システムの既定のマイク</span></div>${meter(9)}</div><div class="row" style="border-top:1px solid var(--line)"><span>▣</span><div><h3>PC音声</h3><span class="small muted">${audioMode==='system'?'PC全体の音声':'選択したアプリの音声'}</span></div>${meter(6)}</div></div><p class="small" style="color:var(--green)">✓ 録音データを保存中</p><p class="small muted" style="margin:8px 0 28px">文字起こし・話者分離は録音終了後に開始 ${info('timing')}</p><button class="danger" style="padding:10px 28px" onclick="stopRecording()">■ 録音を終了</button></div></div>`}
function stopRecording(){if(!recording){previewScreen('record');return}modal('録音を終了しますか？',`<p>録音時間 ${formatTime(elapsed)}。終了すると音声を保存し、文字起こしと話者分離を開始します。</p>`,'録音を終了',()=>{recording=false;updateRecording();toast('録音を保存しました（デモ）');startProcessing()},true)}
function startProcessing(){clearInterval(processTimer);processStep=1;navigate('processing');processTimer=setInterval(()=>{processStep++;if(processStep>4){clearInterval(processTimer);navigate('transcript');toast('文字起こしと話者分離が完了しました（デモ）')}else if(screen==='processing')render()},1400)}
function processingView(){return `<div class="content"><h1>${esc(title)}</h1><p class="subtitle">音声から会議の内容を整理しています。</p><div class="steps"><div class="row spread" style="margin-bottom:20px"><h2>文字起こし・話者分離 ${info('timing')}</h2><span class="badge">デモの進行表示</span></div>${['音声の準備','文字起こし','話者の分類','結果の統合'].map((s,i)=>`<div class="step ${i<processStep-1?'done':i===processStep-1?'running':''}"><span class="step-circle">${i<processStep-1?'✓':i+1}</span><div><h3>${s}</h3><p class="small muted">${i<processStep-1?'完了':i===processStep-1?'処理中…':'待機中'}</p></div></div>`).join('')}<p class="small muted" style="margin-top:22px">この画面を離れても、処理は続きます。</p><button style="margin-top:20px" onclick="navigate('list')">会議一覧に戻る</button></div></div>`}
function detailHeader(tab){return `<div class="detail-heading"><div class="row spread"><div><h1>${esc(title)}</h1><p class="subtitle">2026年10月1日 10:00 · 45分 · ${speakers.length}人の話者 <span class="badge green">確認済み</span></p></div>${tab==='transcript'?'<button class="primary" onclick="generateMinutes()">議事録を作成 →</button>':'<div class="row"><button onclick="toggleEdit()">'+(editing?'✓ 編集を完了':'編集する')+'</button><button class="primary" onclick="exportMarkdown()">Markdown出力 ↓</button></div>'}</div></div><div class="tabs"><button class="${tab==='transcript'?'active':''}" onclick="navigate('transcript')">文字起こし</button><button class="${tab==='minutes'?'active':''}" onclick="navigate('minutes')">議事録</button></div>`}
function player(){return `<div class="player"><button class="icon primary" onclick="togglePlay()" aria-label="音声再生のデモ" id="play-button">${playing?'Ⅱ':'▷'}</button><span id="play-time">${formatTime(playhead)}</span><input type="range" min="0" max="2700" value="${playhead}" aria-label="再生位置" oninput="seek(+this.value)"><span>45:00</span><select aria-label="再生速度" id="speed"><option>0.75×</option><option selected>1×</option><option>1.25×</option><option>1.5×</option><option>2×</option></select><span class="muted filename">音声再生デモ ${info('demo')}</span></div>`}
function transcriptView(){return detailHeader('transcript')+`<div class="detail-body"><section class="speaker-panel"><div class="row spread"><h3>話者 ${info('speakers')}</h3><button class="icon ghost" onclick="addSpeaker()" aria-label="話者を追加">＋</button></div><button class="speaker-button ${speakerFilter==='all'?'active':''}" onclick="filterSpeaker('all')">すべての発言 <span class="muted" style="margin-left:auto">${utterances.length}</span></button>${speakers.map(s=>`<button class="speaker-button ${speakerFilter===s.id?'active':''}" onclick="filterSpeaker('${s.id}')"><span class="avatar ${s.color}">${esc(s.initial)}</span><span>${esc(s.name)}</span><span class="muted" style="margin-left:auto">${utterances.filter(u=>u.speaker===s.id).length}</span></button><button class="ghost small" style="min-height:26px;margin-left:30px;padding:0 8px;color:var(--muted)" onclick="renameSpeaker('${s.id}')">名前を変更</button>`).join('')}<div style="border-top:1px solid var(--line);margin-top:22px;padding-top:17px"><button style="width:100%;font-size:12px" onclick="mergeSpeakers()">話者を統合</button><button style="width:100%;font-size:12px;margin-top:8px" onclick="reanalyze()">人数を指定して再解析</button></div></section><section class="transcript"><div class="row spread" style="margin-bottom:13px"><h3>発言一覧</h3><button class="ghost small" style="min-height:30px" onclick="manageSpeakers()">話者の編集</button><span class="small muted">本文をクリックして編集</span></div><div class="search"><span>⌕</span><input placeholder="発言を検索" aria-label="発言を検索" oninput="searchUtterances(this.value)"></div><div id="utterances">${utteranceRows()}</div></section></div>`+player()}
function utteranceRows(q=''){return utterances.filter(u=>(speakerFilter==='all'||u.speaker===speakerFilter)&&u.text.includes(q)).map(u=>{const s=speakers.find(s=>s.id===u.speaker);return `<article class="utterance" data-id="${u.id}"><div class="utterance-head"><span class="avatar ${s.color}">${esc(s.initial)}</span><select aria-label="${u.time}の話者" onchange="assignSpeaker(${u.id},this.value)">${speakers.map(sp=>`<option value="${sp.id}" ${sp.id===s.id?'selected':''}>${esc(sp.name)}</option>`).join('')}</select><button class="stamp" onclick="seek(${u.sec})">${u.time}</button>${u.overlap?'<span class="badge warn">重複発話</span>':''}<span class="edit-hint">自動保存</span></div><div class="utterance-text" contenteditable="true" role="textbox" aria-label="${u.time}の発言を編集" oninput="editUtterance(${u.id},this.innerText)">${esc(u.text)}</div></article>`}).join('')||'<p class="empty">該当する発言はありません。</p>'}
function filterSpeaker(id){speakerFilter=id;render()}function searchUtterances(q){$('#utterances').innerHTML=utteranceRows(q)}function assignSpeaker(id,s){utterances.find(u=>u.id===id).speaker=s;markSaved();toast('発言の話者を変更しました')}function editUtterance(id,text){utterances.find(u=>u.id===id).text=text;markSaved()}let saveTimer;function markSaved(){$('#saved').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>$('#saved').textContent='✓ すべて保存済み',650)}
function manageSpeakers(){modal('話者の編集',speakers.map(s=>`<button style="width:100%;margin-top:8px;text-align:left" onclick="$('#dialog').close();renameSpeaker('${s.id}')">${esc(s.name)}　✎</button>`).join(''),'閉じる',()=>{})}
function renameSpeaker(id){const s=speakers.find(s=>s.id===id);modal('話者名を変更',`<p>この会議内の話者名を変更します。</p><input id="modal-input" aria-label="話者名" value="${esc(s.name)}">`,'保存',v=>{if(v?.trim()){s.name=v.trim();render();toast('話者名を保存しました')}})}function addSpeaker(){modal('話者を追加','<input id="modal-input" placeholder="例：田中さん" aria-label="新しい話者名">','追加',v=>{if(v?.trim()){speakers.push({id:'s'+Date.now(),name:v.trim(),initial:String(speakers.length+1),color:'b'});render();toast('話者を追加しました')}})}
function mergeSpeakers(){modal('話者を統合',`<p>話者 A の発言を、指定した話者にまとめます。元の割り当ては戻せないため確認してください。</p><select id="modal-input" aria-label="統合先">${speakers.filter(s=>s.id!=='a').map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`,'統合する',v=>{utterances.forEach(u=>{if(u.speaker==='a')u.speaker=v});speakerFilter='all';render();toast('話者の発言を統合しました（デモ）')},true)}function reanalyze(){modal('話者の人数を指定',`<p>現在の修正を保持したまま、新しい解析候補を作成する設計です。</p><select id="modal-input" aria-label="話者人数"><option>自動で推定</option><option>2人</option><option selected>3人</option><option>4人</option><option>5人</option></select>`,'候補を作成',()=>toast('再解析候補の作成を開始しました（デモ）'))}
function minutesDocument(){return `<h2>${esc(title)}</h2><p class="muted small">2026年10月1日 · 10:00–10:45</p><h3>概要</h3><p>次のリリースに向けて、録音機能の検証と初回セットアップの改善方針を確認した。会議アプリの実機テストと画面案の作成を進める。</p><h3>議題</h3><ul><li>マイク・PC音声の録音と会議アプリの対応状況</li><li>初回セットアップと話者修正の操作</li><li>議事録の出力形式</li></ul><h3>決定事項 ${info('citation')}</h3><ul><li>Meet・Zoom・Teamsで実機テストを実施する。 <button class="cite" onclick="showEvidence(2)">根拠 00:28 ↗</button></li><li>初期リリースの議事録出力はMarkdownとする。 <button class="cite" onclick="showEvidence(7)">根拠 02:30 ↗</button></li><li>話者名と発言の割り当ては、録音後に修正できるようにする。 <button class="cite" onclick="showEvidence(8)">根拠 03:10 ↗</button></li></ul><h3>ToDo</h3><table><thead><tr><th>アクション</th><th>担当</th><th>期限</th></tr></thead><tbody><tr><td>初回セットアップの画面案を共有 <button class="cite" onclick="showEvidence(4)">根拠 ↗</button></td><td>佐藤さん</td><td>10/8</td></tr><tr><td>会議アプリの動作確認結果を報告 <button class="cite" onclick="showEvidence(6)">根拠 ↗</button></td><td>${esc(speakers.find(s=>s.id==='a').name)}</td><td>10/8</td></tr></tbody></table><h3>継続検討</h3><p>PDF出力は利用状況を見て次回検討する。 <button class="cite" onclick="showEvidence(7)">根拠 02:30 ↗</button></p>`}
let minutesHTML=null;function minutesView(){return detailHeader('minutes')+`<div class="detail-body"><section class="minutes-scroll"><div class="row spread" style="max-width:760px;margin:0 auto 18px"><span class="small muted">標準テンプレート · 編集版 ${info('citation')}</span><div class="row"><button class="ghost small" style="min-height:30px" onclick="regenerate()">再生成</button><button class="ghost small" style="min-height:30px" onclick="restoreDraft()">前の版に戻す</button></div></div>${editing?'<div class="editorbar"><button onclick="formatDoc(\'bold\')"><b>B</b></button><button onclick="formatDoc(\'formatBlock\',\'h3\')">見出し</button><button onclick="formatDoc(\'insertUnorderedList\')">箇条書き</button><button onclick="insertTable()">表を挿入</button></div>':''}<article class="paper ${editing?'editing':''}" id="minutes-paper" ${editing?'contenteditable="true" role="textbox" aria-label="議事録を編集" oninput="saveMinutes()"':''}>${minutesHTML||minutesDocument()}</article><p class="small muted" style="max-width:760px;margin:15px auto">生成結果は発言の根拠と照合して確認できます。</p></section>${evidence?evidenceView():''}</div>`+player()}
function evidenceView(){const u=citationUtterances.find(u=>u.id===evidence);const s=speakers.find(s=>s.id===u.speaker);return `<aside class="evidence"><div class="row spread"><h3>発言の根拠</h3><button class="ghost icon" onclick="evidence=null;render()" aria-label="根拠を閉じる">×</button></div><p class="small muted" style="margin-top:18px">生成時の文字起こし · 第1版</p><div class="row" style="margin-top:17px"><span class="avatar ${s.color}">${esc(s.initial)}</span><b class="small">${esc(s.name)}</b><button class="stamp" onclick="seek(${u.sec})">${u.time}</button></div><blockquote>${esc(u.text)}</blockquote><button style="width:100%" onclick="seek(${u.sec});playing=true;updatePlayer()">▷ この位置から再生</button><button class="ghost" style="width:100%;margin-top:8px" onclick="speakerFilter='all';navigate('transcript');document.querySelector('[data-id=\"${u.id}\"]')?.scrollIntoView({block:'center'})">文字起こしで確認 ↗</button></aside>`}
function showEvidence(id){if(editing)saveMinutes();evidence=id;render()}function toggleEdit(){if(editing){saveMinutes();editing=false;toast('議事録の編集を保存しました')}else{draftBackup=minutesHTML||minutesDocument();editing=true}render()}function saveMinutes(){minutesHTML=$('#minutes-paper').innerHTML;markSaved()}function formatDoc(command,value){$('#minutes-paper').focus();document.execCommand(command,false,value||null);saveMinutes()}function insertTable(){$('#minutes-paper').focus();document.execCommand('insertHTML',false,'<table><tr><th>項目</th><th>内容</th></tr><tr><td>入力してください</td><td>入力してください</td></tr></table><p><br></p>');saveMinutes()}
function generateMinutes(){navigate('minutes');toast('議事録を生成しています（デモ）');setTimeout(()=>toast('議事録が完成しました。根拠を確認してください'),1500)}function regenerate(){if(editing)saveMinutes();modal('議事録を再生成', '<p>現在の編集を前の版として残し、標準テンプレートの候補に切り替えます。</p>','候補を採用',()=>{draftBackup=minutesHTML||minutesDocument();minutesHTML=minutesDocument();editing=false;render();toast('新しい議事録の候補を採用しました（デモ）')})}function restoreDraft(){if(!draftBackup){toast('戻せる前の版はありません');return}modal('前の版に戻しますか？','<p>現在の編集内容を、保存してある前の版に置き換えます。現在の編集は失われます。</p>','前の版に戻す',()=>{minutesHTML=draftBackup;draftBackup=null;editing=false;render();toast('前の版に戻しました')},true)}
function exportMarkdown(){if(editing)saveMinutes();const el=$('#minutes-paper').cloneNode(true);el.querySelectorAll('button').forEach(n=>n.remove());let md='';Array.from(el.children).forEach(n=>{if(/^H[23]$/.test(n.tagName))md+=(n.tagName==='H2'?'# ':'## ')+n.textContent+'\n\n';else if(n.tagName==='UL')md+=Array.from(n.children).map(li=>'- '+li.textContent.trim()).join('\n')+'\n\n';else if(n.tagName==='TABLE'){const rows=Array.from(n.querySelectorAll('tr')).map(tr=>Array.from(tr.children).map(td=>td.textContent.trim().replace(/\\/g,'\\\\').replace(/\|/g,'\\|')));rows.forEach((cells,i)=>{md+='| '+cells.join(' | ')+' |\n';if(i===0)md+='| '+cells.map(()=>'---').join(' | ')+' |\n'});md+='\n'}else md+=n.innerText+'\n\n'});const u=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='会議議事録_デモ.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Markdownファイルを書き出しました')}
function seek(value){playhead=value;updatePlayer()}function togglePlay(){playing=!playing;updatePlayer()}function updatePlayer(){if($('#play-time')){$('#play-time').textContent=formatTime(playhead);$('.player input').value=playhead;$('#play-button').textContent=playing?'Ⅱ':'▷'}}
function settingsView(){return `<div class="content"><div class="settings"><div class="page-heading"><h1>設定</h1><p class="subtitle">録音環境、ローカルAI、表示を管理します。</p></div><div class="card"><h2>表示</h2><div class="settings-row"><span>テーマ</span><select aria-label="テーマ" onchange="setTheme(this.value)"><option value="light" ${theme==='light'?'selected':''}>ライト</option><option value="dark" ${theme==='dark'?'selected':''}>ダーク</option><option value="system" ${theme==='system'?'selected':''}>システムに合わせる</option></select></div></div><div class="card"><h2>ローカルAI ${info('local')}</h2><div class="settings-row"><div><h3>文字起こし・話者分離・議事録生成</h3><span class="small muted">標準プロファイル</span></div><span class="badge green">✓ 準備完了</span></div><div class="settings-row"><span>モデルファイル</span><button onclick="toast('実装時はモデルファイルを選択して取り込みます')">ローカルから取り込む</button></div></div><div class="card"><h2>データと保存 ${info('retention')}</h2><div class="settings-row"><div><h3>保存先</h3><span class="small muted">ユーザーのドキュメント / LocalNote</span></div><button onclick="toast('実装時はOSのフォルダー選択画面を開きます')">変更</button></div><div class="settings-row"><span>録音形式</span><span class="badge">FLAC</span></div><div class="settings-row"><span>データの処理</span><span style="color:var(--green)" class="small">この端末内で処理</span></div></div><p class="small muted" style="margin-top:20px">このHTMLの設定・入力状態はプレビュー用です。 ${info('demo')}</p></div></div>`}
function setTheme(value){theme=value;document.body.classList.toggle('dark',value==='dark'||value==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}function toggleTheme(){setTheme(document.body.classList.contains('dark')?'light':'dark');if(screen==='settings')render()}matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme==='system')setTheme('system')});
setInterval(()=>{if(recording){elapsed++;updateRecording();document.querySelectorAll('.meter').forEach(m=>{let n=5+Math.floor(Math.random()*8);m.querySelectorAll('i').forEach((b,i)=>b.classList.toggle('on',i<n))})}if(playing){playhead=Math.min(2700,playhead+(parseFloat($('#speed')?.value)||1));if(playhead===2700)playing=false;updatePlayer()}},1000);
let dragStart=null;$('#drag').addEventListener('pointerdown',e=>{const r=$('#mini').getBoundingClientRect();dragStart={x:e.clientX,y:e.clientY,left:r.left,top:r.top};$('#drag').setPointerCapture(e.pointerId)});$('#drag').addEventListener('pointermove',e=>{if(!dragStart)return;const m=$('#mini');m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,dragStart.left+e.clientX-dragStart.x))+'px';m.style.top=Math.max(8,Math.min(innerHeight-m.offsetHeight-8,dragStart.top+e.clientY-dragStart.y))+'px';m.style.right='auto';m.style.bottom='auto'});$('#drag').addEventListener('pointerup',()=>dragStart=null);$('#drag').addEventListener('pointercancel',()=>dragStart=null);addEventListener('resize',()=>{const m=$('#mini');m.style.left='';m.style.top='';m.style.right='';m.style.bottom=''});navigate('list');
</script></body></html>
