architecture = "arm64"
cpu = "Apple M1 Max (10 cores)"
memory_gib = 32
gpu = "Apple M1 Max integrated"
power_mode = "record-at-run-time"
notes = "2026-10-02 に開発端末から取得。性能基準の16GB端末とは別枠。"

[[devices]]
id = "macos-arm64-16gb"
