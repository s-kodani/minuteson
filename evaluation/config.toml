schema_version = 1
project = "MON"
timezone = "Asia/Tokyo"

[thresholds]
max_standard_processing_ratio = 0.5
max_minutes_processing_ratio = 0.0833333333
max_recording_tail_loss_seconds = 5.0
max_speaker_count = 10
max_duration_seconds = 14400

