[[datasets]]
id = "jp-meeting-3spk-pilot"
required = false
status = "needed"
audio_path = "evaluation/data/jp-meeting-3spk-pilot/source.flac"
transcript_path = "evaluation/data/jp-meeting-3spk-pilot/transcript.json"
diarization_path = "evaluation/data/jp-meeting-3spk-pilot/diarization.json"
minutes_truth_path = "evaluation/data/jp-meeting-3spk-pilot/minutes-truth.json"
terms_path = "evaluation/data/jp-meeting-3spk-pilot/terms.json"
language = "ja"
speaker_count = 3
duration_seconds = 3625.236
contains_overlap = false
contains_english_terms = false
consent_confirmed = true
sha256 = "d76949725864745629bc5aabbc918f689bb1c8f698bec2c96448cb8998f8a6a4"
notes = "先行評価専用。音声は配置済み・利用同意はユーザー申告。3人以上との申告だが正確な話者数は未確認のためspeaker_count=3は仮値、status=neededを維持する。点検日のみユーザー確認済み、他の用語・重複発話は未確認。10話者の必須検証を代替しない。"

[recording_matrix]
platforms = ["macos", "windows"]
clients = ["meet:chrome", "meet:edge", "zoom:desktop", "teams:desktop"]
capture_modes = ["system", "application"]
outputs = ["headset", "speaker"]
duration_seconds = 900

[[stability_scenarios]]
id = "four-hour-recording"
platforms = ["macos", "windows"]
duration_seconds = 14400
actions = ["record", "stop", "finalize", "analyze"]

[[stability_scenarios]]
id = "device-disconnect-reconnect"
platforms = ["macos", "windows"]
duration_seconds = 300
actions = ["disconnect-microphone", "verify-system-continues", "reconnect-same-microphone", "verify-gap"]

[[stability_scenarios]]
id = "forced-termination-recovery"
platforms = ["macos", "windows"]
duration_seconds = 120
actions = ["force-terminate", "restart", "recover-committed-audio", "measure-tail-loss"]

[[stability_scenarios]]
id = "explicit-sleep-resume"
platforms = ["macos", "windows"]
duration_seconds = 180
actions = ["start-recording", "explicit-sleep", "resume", "verify-gap-and-recovery"]
