name: Security validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-security.txt
      - run: python -m pip install -r tools/requirements-security.txt
      - run: python tools/mon_ci_tools.py
      - name: Workflow and policy validation
        run: |
          actionlint -shellcheck=''
          python tools/mon_security.py exceptions
      - name: Redacted secret scan
        env:
          MON_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MON_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$MON_BASE_SHA" ]; then
            gitleaks git --redact=100 --config .gitleaks.toml --log-opts="$MON_BASE_SHA..$MON_HEAD_SHA"
          else
            gitleaks git --redact=100 --config .gitleaks.toml
          fi
      - name: Dependency and native-engine vulnerabilities
        run: python tools/mon_security.py scan
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dependencies-${{ github.run_id }}
          path: output/security/
          retention-days: 30
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-security.txt
      - run: python -m pip install -r tools/requirements-security.txt
      - run: python tools/mon_docs.py
  codeql:
    if: github.event.repository.private == false
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-24.04
            mode: none
          - language: javascript-typescript
            os: ubuntu-24.04
            mode: none
          - language: python
            os: ubuntu-24.04
            mode: none
          - language: rust
            os: macos-15
            mode: none
          - language: c-cpp
            os: windows-2022
            mode: none
          - language: swift
            os: macos-15-intel
            mode: manual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
      MON_SAVE_CI_CACHE: ${{ github.ref == 'refs/heads/main' && github.workflow != 'Release build' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.source_ref == '' || inputs.source_ref == github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-security.txt
      - run: python -m pip install -r tools/requirements-security.txt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.language == 'rust' || matrix.language == 'swift'
      - name: Restore Rust FFI build for Swift analysis
        if: matrix.language == 'swift'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Cache only Rust; Swift must compile again under CodeQL extraction.
          workspaces: . -> probes/macos-capture/.build/capture-core
          key: codeql-swift-ffi-v1
          save-if: ${{ env.MON_SAVE_CI_CACHE == 'true' }}
      - name: Select Swift 6.2 and prepare Rust FFI
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          for developer in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            if DEVELOPER_DIR="$developer" /usr/bin/swift --version | python -c 'import re,sys; m=re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()); sys.exit(0 if m and tuple(map(int,m.groups())) >= (6,2) else 1)'; then
              export DEVELOPER_DIR="$developer"
              echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
              break
            fi
          done
          sh probes/macos-capture/build-core.sh
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - name: Swift extraction build
        if: matrix.language == 'swift'
        run: swift build --package-path probes/macos-capture --configuration release --arch x86_64
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          output: output/codeql
          upload: ${{ inputs.source_ref == '' }}
      - name: Evaluate findings, including existing high-severity findings
        run: python tools/mon_security.py sarif --sarif output/codeql --output output/security-codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-codeql-${{ matrix.language }}-${{ github.run_id }}
          path: |
            output/codeql/
            output/security-codeql/
          retention-days: 30
  gate:
    name: Security gate
    if: always()
    needs: [policy, docs, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MON_POLICY: ${{ needs.policy.result }}
      MON_DOCS: ${{ needs.docs.result }}
      MON_CODEQL: ${{ needs.codeql.result }}
      MON_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - run: |
          python3 - <<'PY'
          import os
          required = ['MON_POLICY', 'MON_DOCS']
          if os.environ['MON_PRIVATE'] != 'true':
              required.append('MON_CODEQL')
          if any(os.environ[key] != 'success' for key in required):
              raise SystemExit('Required security job failed, was cancelled, or was skipped')
          if os.environ['MON_PRIVATE'] == 'true':
              print('CodeQL is not available here until public-repository activation; SAST was not performed')
          PY
