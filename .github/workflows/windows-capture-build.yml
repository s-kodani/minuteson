name: Windows capture build

'on':
  # The desktop-platform workflow builds this probe with the QA installer.
  # Keep this manual entry point for capture-only diagnostics.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> probes/windows-capture/build/capture-core
      - name: Prepare fixed capture protocol dependency
        run: python tools/mon_windows_capture_dependencies.py
      - name: Configure x64 probe
        run: cmake -S probes/windows-capture -B probes/windows-capture/build -G "Visual Studio 17 2022" -A x64
      - name: Build Release probe
        run: cmake --build probes/windows-capture/build --config Release
      - name: Validate packet clock without audio hardware
        run: ctest --test-dir probes/windows-capture/build -C Release --output-on-failure --no-tests=error
