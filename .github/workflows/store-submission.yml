name: Microsoft Store submission

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Optional published release ID to resume after fixing a failure'
        type: string
        default: ''

permissions:
  contents: write
  actions: read
  attestations: read

concurrency:
  group: store-submission
  cancel-in-progress: false

jobs:
  submit:
    if: vars.STORE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    environment: release-store
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Submit or poll a source-bound Store update
        env:
          GH_TOKEN: ${{ github.token }}
          MON_STORE_RELEASE_ID: ${{ inputs.release_id }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_APPLICATION_ID: ${{ vars.STORE_APPLICATION_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: python tools/mon_store_submission.py
