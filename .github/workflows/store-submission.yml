name: Microsoft Store submission

on:
  release:
    types: [published]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Submit requires approval; poll only reads existing submission status'
        type: choice
        options: [submit, poll]
        default: submit
      release_id:
        description: 'Published release ID (required for submit, optional for poll)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  request:
    if: github.event_name == 'release' && vars.STORE_PUBLISH_ENABLED == 'true' && github.event.repository.private == false
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Request Store approval on main
        env:
          GH_TOKEN: ${{ github.token }}
          MON_STORE_RELEASE_ID: ${{ github.event.release.id }}
        run: python tools/mon_store_submission.py request
  submit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'submit' && vars.STORE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    # Required reviewers must be configured on this Environment. Credentials
    # and all Store writes are confined to this approved job.
    environment: release-store
    concurrency:
      group: store-submission-write
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Submit the approved source-bound Store update
        env:
          GH_TOKEN: ${{ github.token }}
          MON_STORE_RELEASE_ID: ${{ inputs.release_id }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_APPLICATION_ID: ${{ vars.STORE_APPLICATION_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: python tools/mon_store_submission.py submit
  poll:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'poll')) && vars.STORE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    # Separate credentials allow GET-only polling without repeated approval.
    environment: release-store-status
    concurrency:
      group: store-status-poll
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read existing Store submission statuses
        env:
          GH_TOKEN: ${{ github.token }}
          MON_STORE_RELEASE_ID: ${{ inputs.release_id }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_APPLICATION_ID: ${{ vars.STORE_APPLICATION_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: python tools/mon_store_submission.py poll
