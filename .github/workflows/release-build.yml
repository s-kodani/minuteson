name: Main build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: main-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      source_sha: ${{ steps.guard.outputs.source_sha }}
      build: ${{ steps.guard.outputs.build }}
      reuse: ${{ steps.guard.outputs.reuse }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MON_BASE: ${{ github.event.before }}
        run: python tools/mon_main_build.py guard
  ci:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    uses: ./.github/workflows/desktop-platform-build.yml
    with:
      source_ref: ${{ needs.guard.outputs.source_sha }}
      full: true
      build_release: ${{ vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.event.repository.private == false }}
  security:
    needs: guard
    if: needs.guard.outputs.reuse == 'false'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security.yml
    with:
      source_ref: ${{ needs.guard.outputs.source_sha }}
      full: ${{ needs.guard.outputs.build == 'true' }}
  macos-sign:
    needs: [guard, ci]
    if: needs.guard.outputs.build == 'true' && vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.event.repository.private == false
    environment: release-macos
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-macos
          path: output/prepared-macos
      - name: Install locked DMG layout dependencies before loading credentials
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-macos-release.txt
      - name: Sign and notarize the same-run prepared app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: python tools/mon_macos_ci_sign.py
      - run: python tools/mon_release_artifacts.py collect --flavor macos --output output/release-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: output/release-macos/
          if-no-files-found: error
          retention-days: 30
  candidate:
    needs: [guard, ci, security, macos-sign]
    if: needs.guard.outputs.build == 'true' && vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: output/release-input
      - name: Verify and assemble public artifacts
        env:
          MON_MAIN_CANDIDATE: 'true'
          MON_SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          MON_TAG: ${{ needs.guard.outputs.tag }}
        run: python tools/mon_release_artifacts.py assemble --input output/release-input --output output/publish --source-sha "$MON_SOURCE_SHA" --tag "$MON_TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: output/publish/*
      - name: Add provenance bundle
        env:
          MON_PROVENANCE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$MON_PROVENANCE" output/publish/provenance.json
      - id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ needs.guard.outputs.source_sha }}
          path: output/publish/
          if-no-files-found: error
          retention-days: 30
      - name: Record completed main candidate
        env:
          MON_SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          MON_TAG: ${{ needs.guard.outputs.tag }}
          MON_ARTIFACT_URL: ${{ steps.candidate.outputs.artifact-url }}
        run: python tools/mon_main_build.py summary
