name: Desktop platform validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Validation scope (full includes installers and native resources)'
        type: choice
        options: [full, quick]
        default: full
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      full:
        type: boolean
        default: false
      skip_windows_msix:
        description: 'Release build delegates Store package validation to its required store job'
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-platform-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate delegated Microsoft Store check
        env:
          MON_SKIP_WINDOWS_MSIX: ${{ inputs.skip_windows_msix }}
          MON_CI_FULL: ${{ inputs.full || inputs.suite == 'full' }}
          MON_CALLER: ${{ github.workflow }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['MON_SKIP_WINDOWS_MSIX'] == 'true' and (os.environ['MON_CI_FULL'] != 'true' or os.environ['MON_CALLER'] != 'Release build'):
              raise SystemExit('Only full Release build validation may delegate its Store package check')
          PY
      - id: scope
        env:
          MON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MON_FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' }}
        run: python3 tools/mon_ci_scope.py
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-security.txt
      - run: python -m pip install -r tools/requirements-security.txt
      - name: Common tooling tests
        run: python -m unittest discover -s tests -v
  browser:
    needs: changes
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      MON_SAVE_CI_CACHE: ${{ github.ref == 'refs/heads/main' && github.workflow != 'Release build' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.source_ref == '' || inputs.source_ref == github.sha) }}
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> app/src-tauri/target
          key: browser
          save-if: ${{ env.MON_SAVE_CI_CACHE == 'true' }}
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Check generated command contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/mon_contracts.py --check
          python tools/mon_model_catalog.py --check
      - name: Check generated IPC types and validators
        working-directory: app
        run: npm run check:contracts
      - name: Check application permissions and platform configuration
        run: python -m unittest discover -s tests -p test_mon_tauri_platform.py -v
      - name: Dependency notice generation tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p test_mon_third_party_notices.py -v
      - name: Installer identity and safe publication tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_mon_windows_build_evidence.py -v
          python -m unittest discover -s tests -p test_mon_windows_installer_publication.py -v
          python -m unittest discover -s tests -p test_mon_windows_unsigned.py -v
      - name: Frontend tests and build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build
      - name: Restore browser engine
        id: browser_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/playwright
          key: playwright-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install browser engine
        working-directory: app
        shell: bash
        run: npx playwright install --with-deps ${{ runner.os == 'macOS' && 'webkit' || 'chromium --only-shell' }}
      - name: Configure macOS browser keyboard navigation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Match the regression tests' Tab navigation through all controls.
          defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
          defaults read org.webkit.Playwright AppleKeyboardUIMode
      - name: Browser regression tests
        working-directory: app
        run: npm run test:browser
      - name: Save verified browser engine
        if: success() && env.MON_SAVE_CI_CACHE == 'true' && steps.browser_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/playwright
          key: ${{ steps.browser_cache.outputs.cache-primary-key }}
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ runner.os }}
          path: output/playwright/
          retention-days: 7
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    env:
      PYTHONUTF8: '1'
      MON_CI_FULL: ${{ inputs.full || inputs.suite == 'full' }}
      MON_SKIP_WINDOWS_MSIX: ${{ inputs.skip_windows_msix }}
      MON_SAVE_CI_CACHE: ${{ github.ref == 'refs/heads/main' && github.workflow != 'Release build' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.source_ref == '' || inputs.source_ref == github.sha) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (inputs.full || inputs.suite == 'full') && matrix.os == 'windows-2022' && 180 || 120 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust_cache
        with:
          workspaces: . -> app/src-tauri/target
          # Full builds also compile release dependencies. Their immutable
          # cache must not be preempted by a quick build's debug-only entry.
          key: ${{ env.MON_CI_FULL == 'true' && 'full' || '' }}
          save-if: ${{ env.MON_SAVE_CI_CACHE == 'true' }}
      - name: Restore existing Rust dependencies on a cold full build
        if: env.MON_CI_FULL == 'true' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> app/src-tauri/target
          save-if: 'false'
      - name: Select Swift toolchain for native cache
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for developer in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            if DEVELOPER_DIR="$developer" /usr/bin/swift --version | python -c 'import re,sys; m=re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()); sys.exit(0 if m and tuple(map(int,m.groups())) >= (6,2) else 1)'; then
              echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Fingerprint windows-runtime inputs and toolchain
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        id: windows_runtime_key
        shell: bash
        run: python tools/mon_ci_cache.py --component windows-runtime >> "$GITHUB_OUTPUT"
      - name: Restore windows-runtime build intermediates
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        id: windows_runtime_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.windows_runtime_key.outputs.paths }}
          key: ${{ steps.windows_runtime_key.outputs.key }}
      - name: Fingerprint windows-capture inputs and toolchain
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        id: windows_capture_key
        shell: bash
        run: python tools/mon_ci_cache.py --component windows-capture >> "$GITHUB_OUTPUT"
      - name: Restore windows-capture build intermediates
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        id: windows_capture_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.windows_capture_key.outputs.paths }}
          key: ${{ steps.windows_capture_key.outputs.key }}
      - name: Fingerprint macos-capture inputs and toolchain
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        id: macos_capture_key
        shell: bash
        run: python tools/mon_ci_cache.py --component macos-capture >> "$GITHUB_OUTPUT"
      - name: Restore macos-capture build intermediates
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        id: macos_capture_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.macos_capture_key.outputs.paths }}
          key: ${{ steps.macos_capture_key.outputs.key }}
      - name: Fingerprint macos-workers inputs and toolchain
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        id: macos_workers_key
        shell: bash
        run: python tools/mon_ci_cache.py --component macos-workers >> "$GITHUB_OUTPUT"
      - name: Restore macos-workers build intermediates
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        id: macos_workers_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.macos_workers_key.outputs.paths }}
          key: ${{ steps.macos_workers_key.outputs.key }}
      - name: Restore checksum-verified native downloads
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        id: native_downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/windows-parity/assets
            .cache/windows-runtime/downloads
          key: native-downloads-v1-${{ runner.os }}-${{ hashFiles('app/model-catalog/*.json', 'tools/mon_windows_runtime.py', 'tools/mon_windows_workers.py', 'tools/mon_inference_runtime.py', 'tools/mon_windows_vulkan_sdk.py', 'tools/mon_windows_capture_dependencies.py') }}
      - name: Record restored cache context
        shell: bash
        env:
          MON_RAW_RUST_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          MON_RAW_WINDOWS_RUNTIME: ${{ steps.windows_runtime_cache.outputs.cache-hit }}
          MON_RAW_WINDOWS_CAPTURE: ${{ steps.windows_capture_cache.outputs.cache-hit }}
          MON_RAW_MACOS_CAPTURE: ${{ steps.macos_capture_cache.outputs.cache-hit }}
          MON_RAW_MACOS_WORKERS: ${{ steps.macos_workers_cache.outputs.cache-hit }}
        run: |
          python - <<'PY'
          import json, os
          components = {name: os.environ['MON_RAW_' + name.upper().replace('-', '_')] for name in ('windows-runtime', 'windows-capture', 'macos-capture', 'macos-workers')}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as output:
              output.write('MON_CI_RUST_CACHE_HIT=' + os.environ['MON_RAW_RUST_CACHE_HIT'] + '\n')
              output.write('MON_CI_NATIVE_CACHE_HIT=' + json.dumps({key: value for key, value in components.items() if value}) + '\n')
          PY
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Shared Rust core tests
        run: cargo test --workspace --exclude mon-desktop --locked --lib
      - name: Quick native Rust tests without packaged resources
        if: env.MON_CI_FULL != 'true'
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        run: python tools/mon_ci_native_tests.py --suite quick --all-targets --processes 2 --threads 4 --timings-json output/rust-tests/${{ runner.os }}.json
      - name: Windows public signing preflight fails without a certificate
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_windows_release_signing.py -v
      - name: Fetch notice source metadata
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        run: cargo fetch --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Prepare Windows resources before native validation
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP 'mon-windows-preparation.json'
          python tools/mon_windows_preparation.py run --phase windows-preparation --report output/rust-tests/Windows-phases.json -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File app/prepare-windows.ps1 -Receipt $receipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MON_WINDOWS_PREPARATION_RECEIPT=$receipt" >> $env:GITHUB_ENV
      - name: Validate Windows capture and model catalog
        # Runtime/helper resources now exist, so run the Windows synthetic
        # capture/storage tests without microphones or real model downloads.
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        run: |
          ctest --test-dir probes/windows-capture/build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MON_WINDOWS_MODEL_OPTIONS = Join-Path $env:RUNNER_TEMP 'mon-windows-model-options.json'
          python tools/mon_ci_native_tests.py --suite full --all-targets --timings-json output/rust-tests/${{ runner.os }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test app/tests/windows-model-download-state.test.ts
      - name: macOS Swift compiler and capture regression tests
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Prefer an installed toolchain satisfying the package tools version.
          # macos-15 images may default to an older Xcode despite carrying 26.x.
          for developer in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            if DEVELOPER_DIR="$developer" /usr/bin/swift --version | python -c 'import re,sys; m=re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()); sys.exit(0 if m and tuple(map(int,m.groups())) >= (6,2) else 1)'; then
              export DEVELOPER_DIR="$developer"
              echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
              break
            fi
          done
          swift --version
          swift --version | python -c 'import re,sys; m=re.search(r"Swift version (\d+)\.(\d+)", sys.stdin.read()); sys.exit(0 if m and tuple(map(int,m.groups())) >= (6,2) else "Swift 6.2 or later is required")'
          sh probes/macos-capture/build-core.sh
          swift build --package-path probes/macos-capture --configuration release
          swift test --package-path probes/macos-capture
      - name: macOS common and native regression tests
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        run: python tools/mon_ci_native_tests.py --suite full --all-targets --swift-fixture --timings-json output/rust-tests/${{ runner.os }}.json
      - name: Prepare macOS resident workers for runtime regression
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        run: python tools/mon_inference_runtime.py
      - name: Validate upgraded LLM runtimes with representative weights
        if: env.MON_CI_FULL == 'true'
        run: python tools/mon_llama_runtime_check.py --report output/rust-tests/llama-runtime-${{ runner.os }}.json
      - name: Build Windows QA installer
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        run: python tools/mon_windows_preparation.py run --phase windows-qa-packaging --report output/rust-tests/Windows-phases.json -- npm.cmd --prefix app run tauri:windows:qa:build
      - name: Verify DPI declarations in the linked Windows QA executable
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        run: |
          $env:MON_WINDOWS_DPI_BINARY = Join-Path $env:GITHUB_WORKSPACE 'app/src-tauri/target/x86_64-pc-windows-msvc/release/mon-desktop.exe'
          python -m unittest discover -s tests -p test_mon_windows_dpi.py -v
      - name: Build and verify Microsoft Store MSIX
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows' && env.MON_SKIP_WINDOWS_MSIX != 'true'
        run: python tools/mon_windows_preparation.py run --phase windows-store-packaging --report output/rust-tests/Windows-phases.json -- npm.cmd --prefix app run tauri:windows:store:build
      - name: Verify DPI declarations in the linked Windows Store executable
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows' && env.MON_SKIP_WINDOWS_MSIX != 'true'
        run: |
          $env:MON_WINDOWS_DPI_BINARY = Join-Path $env:GITHUB_WORKSPACE 'app/src-tauri/target/x86_64-pc-windows-msvc/release/mon-desktop.exe'
          python -m unittest discover -s tests -p test_mon_windows_dpi.py -v
      - name: Upload Microsoft Store build identity
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows' && env.MON_SKIP_WINDOWS_MSIX != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minuteson-windows-x64-store-identity
          path: |
            output/windows-store-work/*/source.json
            output/windows-store-work/*/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows build identity
        if: env.MON_CI_FULL == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mon-windows-x64-qa-identity
          path: output/windows-qa-work/*-build.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify staged headless executable ownership
        if: env.MON_CI_FULL == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        run: |
          set -euo pipefail
          cargo build --locked --profile test --bin mon-desktop
          executable="$GITHUB_WORKSPACE/app/src-tauri/target/debug/mon-desktop"
          digest=$(shasum -a 256 "$executable" | cut -d ' ' -f 1)
          node tools/mon_owned_engine_check.mjs --executable "$executable" --sha256 "$digest"
      - name: Save windows-runtime build intermediates
        if: success() && env.MON_CI_FULL == 'true' && runner.os == 'Windows' && env.MON_SAVE_CI_CACHE == 'true' && steps.windows_runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.windows_runtime_key.outputs.paths }}
          key: ${{ steps.windows_runtime_key.outputs.key }}
      - name: Save windows-capture build intermediates
        if: success() && env.MON_CI_FULL == 'true' && runner.os == 'Windows' && env.MON_SAVE_CI_CACHE == 'true' && steps.windows_capture_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.windows_capture_key.outputs.paths }}
          key: ${{ steps.windows_capture_key.outputs.key }}
      - name: Save macos-capture build intermediates
        if: success() && env.MON_CI_FULL == 'true' && runner.os == 'macOS' && env.MON_SAVE_CI_CACHE == 'true' && steps.macos_capture_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.macos_capture_key.outputs.paths }}
          key: ${{ steps.macos_capture_key.outputs.key }}
      - name: Save macos-workers build intermediates
        if: success() && env.MON_CI_FULL == 'true' && runner.os == 'macOS' && env.MON_SAVE_CI_CACHE == 'true' && steps.macos_workers_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.macos_workers_key.outputs.paths }}
          key: ${{ steps.macos_workers_key.outputs.key }}
      - name: Save checksum-verified native downloads
        if: success() && env.MON_CI_FULL == 'true' && env.MON_SAVE_CI_CACHE == 'true' && runner.os == 'Windows' && steps.native_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/windows-parity/assets
            .cache/windows-runtime/downloads
          key: ${{ steps.native_downloads.outputs.cache-primary-key }}
      - name: Upload Rust timing diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests-${{ runner.os }}
          path: output/rust-tests/
          if-no-files-found: warn
          retention-days: 7
  gate:
    name: CI gate
    if: always()
    needs: [changes, python, browser, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MON_CHANGES: ${{ needs.changes.result }}
      MON_PYTHON: ${{ needs.python.result }}
      MON_BROWSER: ${{ needs.browser.result }}
      MON_NATIVE: ${{ needs.native.result }}
      MON_REQUIRED: ${{ needs.changes.outputs.native }}
    steps:
      - run: |
          python3 - <<'PY'
          import os
          required = ['MON_CHANGES', 'MON_PYTHON']
          if os.environ['MON_REQUIRED'] == 'true':
              required += ['MON_BROWSER', 'MON_NATIVE']
          if any(os.environ[key] != 'success' for key in required):
              raise SystemExit('Required CI job failed, was cancelled, or was skipped')
          PY
