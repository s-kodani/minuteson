name: Desktop platform validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'probes/windows-capture/**'
      - 'probes/macos-capture/**'
      - 'tests/fixtures/audio-import/**'
      - 'probes/inference-worker/**'
      - 'probes/speaker-embedding/**'
      - 'tools/mon_third_party_notices.py'
      - 'tools/mon_windows_*.py'
      - 'tests/test_mon_tauri_platform.py'
      - 'tests/test_mon_third_party_notices.py'
      - 'tests/test_windows_release_signing.py'
      - 'tests/test_mon_windows_build_evidence.py'
      - 'tests/test_mon_windows_installer_publication.py'
      - 'tools/sign-windows.ps1'
      - 'tools/publish-windows-installer.ps1'
      - 'third-party/**'
      - '.github/workflows/desktop-platform-build.yml'
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'probes/windows-capture/**'
      - 'probes/macos-capture/**'
      - 'tests/fixtures/audio-import/**'
      - 'probes/inference-worker/**'
      - 'probes/speaker-embedding/**'
      - 'tools/mon_third_party_notices.py'
      - 'tools/mon_windows_*.py'
      - 'tests/test_mon_tauri_platform.py'
      - 'tests/test_mon_third_party_notices.py'
      - 'tests/test_windows_release_signing.py'
      - 'tests/test_mon_windows_build_evidence.py'
      - 'tests/test_mon_windows_installer_publication.py'
      - 'tools/sign-windows.ps1'
      - 'tools/publish-windows-installer.ps1'
      - 'third-party/**'
      - '.github/workflows/desktop-platform-build.yml'

permissions:
  contents: read

concurrency:
  group: desktop-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Check application permissions and platform configuration
        run: python -m unittest discover -s tests -p test_mon_tauri_platform.py -v
      - name: Dependency notice generation tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p test_mon_third_party_notices.py -v
      - name: Installer identity and safe publication tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_mon_windows_build_evidence.py -v
          python -m unittest discover -s tests -p test_mon_windows_installer_publication.py -v
      - name: Frontend tests and build
        working-directory: app
        run: |
          npm test
          npm run build
      - name: Rust formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - name: Check native application and test compilation
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --locked --tests
      - name: Common state and startup tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib ipc_acl::tests
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib session::tests
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib startup_attention::tests
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib startup_instance::tests
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib storage::playback::tests
      - name: Windows public signing preflight fails without a certificate
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_windows_release_signing.py -v
      - name: Windows process ownership, dialogs and storage tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib local_engine::windows::tests
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib platform_dialog::tests
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib storage::windows_tests
      - name: Fetch notice source metadata
        if: runner.os == 'Windows'
        run: cargo fetch --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Build Windows QA installer
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run tauri:windows:qa:build
      - name: Validate Windows capture and model catalog
        # Runtime/helper resources now exist, so run the Windows synthetic
        # capture/storage tests without microphones or real model downloads.
        if: runner.os == 'Windows'
        run: |
          ctest --test-dir probes/windows-capture/build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MON_WINDOWS_MODEL_OPTIONS = Join-Path $env:RUNNER_TEMP 'mon-windows-model-options.json'
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib windows_integration_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib windows_five_second
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test app/tests/windows-model-download-state.test.ts
      - name: macOS Swift compiler and capture regression tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Prefer an installed toolchain satisfying the package tools version.
          # macos-15 images may default to an older Xcode despite carrying 26.x.
          for developer in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            if DEVELOPER_DIR="$developer" /usr/bin/swift --version | python -c 'import re,sys; m=re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()); sys.exit(0 if m and tuple(map(int,m.groups())) >= (6,2) else 1)'; then
              export DEVELOPER_DIR="$developer"
              echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
              break
            fi
          done
          swift --version
          swift --version | python -c 'import re,sys; m=re.search(r"Swift version (\d+)\.(\d+)", sys.stdin.read()); sys.exit(0 if m and tuple(map(int,m.groups())) >= (6,2) else "Swift 6.2 or later is required")'
          swift build --package-path probes/macos-capture --configuration release
          swift test --package-path probes/macos-capture
      - name: macOS common and native regression tests
        if: runner.os == 'macOS'
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null,"externalBin":null,"active":false}}'
        run: |
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib swift_generated_pc_only_capture -- --ignored
      - name: Upload Windows QA installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mon-windows-x64-qa
          path: app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows build identity
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mon-windows-x64-qa-identity
          path: output/windows-qa-work/*-build.json
          if-no-files-found: error
          retention-days: 7
