name: Release draft controller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-draft-controller
  cancel-in-progress: false

jobs:
  discover:
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Claim opted-in drafts and dispatch trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
        run: python tools/mon_release.py discover
