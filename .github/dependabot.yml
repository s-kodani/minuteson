version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
