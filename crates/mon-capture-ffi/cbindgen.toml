language = "C"
include_guard = "MON_CAPTURE_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
autogen_warning = "/* Generated from Rust capture ABI. Do not edit this file by hand. */"
header = "/* Borrowed buffers live for the call. Input/output memory must not overlap.\n * Lifecycle and prefix values belong to one native control/writer thread. */"

[parse]
parse_deps = true
include = ["mon-core"]

[export]
item_types = ["structs", "typedefs", "functions"]

[export.rename]
InputLifecycle = "MonCaptureLifecycle"
RawPrefix = "MonRawPrefix"
ReadAt = "MonMediaReadAt"
